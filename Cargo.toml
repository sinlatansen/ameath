[workspace]
resolver = "2"
members  = ["crates/fleet-snowfluff-core", "crates/fleet-snowfluff"]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/kagetsuki1997/fleet-snowfluff"

[workspace.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
device_query = "4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["gif"] }
log = "0.4"
macos-accessibility-client = "0.0.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
pollster = "0.4"
rand = "0.9"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shadow-rs = { version = "2", default-features = false }
sys-locale = "0.3"
tauri = { version = "2.8.5", features = [
  "unstable",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-build = { version = "2.4.1" }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
wgpu = "27"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }
winreg = "0.56"
