[workspace]
resolver = "2"
members  = ["crates/fleet-snowfluff-core", "crates/fleet-snowfluff"]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/kagetsuki1997/fleet-snowfluff"

[workspace.dependencies]
log              = "0.4"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tauri            = { version = "2.8.5", features = ["unstable", "macos-private-api"] }
tauri-build      = { version = "2.4.1" }
tauri-plugin-log = "2"
wgpu             = "27"
image            = { version = "0.25", default-features = false, features = ["gif"] }
pollster         = "0.4"
env_logger       = "0.11"
