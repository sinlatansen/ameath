[workspace]
resolver = "2"
members  = ["crates/fleet-snowfluff-core", "crates/fleet-snowfluff"]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/kagetsuki1997/fleet-snowfluff"

[workspace.dependencies]
log              = "0.4"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tauri            = { version = "2.8.5" }
tauri-build      = { version = "2.4.1" }
tauri-plugin-log = "2"
